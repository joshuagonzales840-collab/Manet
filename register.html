<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign Up | K-Tix Assist</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="auth" style="max-width:640px"><a class="logo" href="index.html" style="text-align:center">K-Tix
            <b>Assist</b></a>
        <h2 style="text-align:center;margin:0">Create Your K-Tix Assist Account</h2>
        <form class="card" id="rf" novalidate><label>Full Name</label><input id="fn"><label>Username</label><input
                id="un"><label>Email Address</label><input id="em" type="email"><label>Mobile Number</label><input
                id="mb" type="tel"><label>Date of Birth</label><input id="db" type="date"><label>Address</label><input
                id="ad"><label>Password</label><input id="p1" type="password"><label>Confirm Password</label><input
                id="p2" type="password">
            <div class="err" id="er"></div><button class="btn full">CREATE ACCOUNT</button>
            <p style="margin-top:12px">Already have an account? <a href="login.html"
                    style="color:var(--pri);font-weight:600">Login</a></p>
        </form>
    </div>
    <script src="js/main.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
